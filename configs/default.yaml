# Shared settings — identical on all machines. Machine-specific overrides go in local.yaml.

seed: 8

paths:                      # all relative to repo root
  data: data/FantasyID
  processed: data/processed
  results: results
  trufor: external/TruFor

data:
  train_split: 0.8
  # add split/manifest settings as your pipeline firms up

training:
  epochs: 20
  lr: 0.0001
  batch_size: 16            # safe default; overridden per machine
  num_workers: 4            # safe default; overridden per machine
  device: cuda
