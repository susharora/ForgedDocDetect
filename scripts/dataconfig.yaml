#Root is where the dataset resides
dataset:
    name: 'FantasyID' 
    root: '../data/FantasyID'     #forward slash used to avoid YAML backslash escape issue
    log:  '../logs/dataingest.txt' # log file for data ingestion pipelines
    
    allowed_splits:         # examples and other folders would be ignored
      - train
      - test

    allowed_traffic_types:  # only two types of traffic
      - bonafide
      - attack

    image_extensions:       # will be compared case-insentively so .JPG will be covered
      - .jpg
      - .jpeg
      - .png

    json_extension: .json

output:
    directory: '../output'
    workbook_name: 'fantasyid_inventory.xlsx'

expected_counts:
  images_total: 3284
  regions_total: 33924

  partitions:
    train:
      total: 1899
      groups:
        - name: bonafide
          selector:
            traffic_type: bonafide
            variant: ""
          expected: 633

        - name: digital_1
          selector:
            traffic_type: attack
            variant: digital_1
          expected: 633

        - name: digital_2
          selector:
            traffic_type: attack
            variant: digital_2
          expected: 633

    test:
      total: 1385
      groups:
        - name: bonafide
          selector:
            traffic_type: bonafide
            variant: ""
          expected: 300

        - name: digital_3
          selector:
            traffic_type: attack
            variant: digital_3
