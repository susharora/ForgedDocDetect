#Root is where the dataset resides
dataset:
    name: 'FantasyID' 
    root: '../data/FantasyID'     #forward slash used to avoid YAML backslash escape issue
    log:  '../logs/dataingest.txt' # log file for data ingestion pipelines
    
    allowed_splits:         # examples and other folders would be ignored
      - train
      - test

    allowed_traffic_types:  # only two types of traffic
      - bonafide
      - attack

    image_extensions:       # will be compared case-insentively so .JPG will be covered
      - .jpg
      - .jpeg
      - .png

    json_extension: .json

output:
    directory: '../output'
    workbook_name: 'fantasyid_inventory.xlsx'

expected_counts:
  images_total: 3284
  regions_total: 33924

  partitions:
    train:
      total: 1899
      groups:
        - name: bonafide
          selector:
            traffic_type: bonafide
            variant: ""
          expected: 633

        - name: digital_1
          selector:
            traffic_type: attack
            variant: digital_1
          expected: 633

        - name: digital_2
          selector:
            traffic_type: attack
            variant: digital_2
          expected: 633

    test:
      total: 1385
      groups:
        - name: bonafide
          selector:
            traffic_type: bonafide
            variant: ""
          expected: 300

        - name: digital_3
          selector:
            traffic_type: attack
            variant: digital_3
          expected: 786

        - name: facedancer
          selector:
            traffic_type: attack
            variant: facedancer
          expected: 150

        - name: textdiffuserft_bfei
          selector:
            traffic_type: attack
            variant: textdiffuserft_bfei
          expected: 149


regression_checks:
  # Existing frozen checks
  json_parse_failures: 0
  dimension_mismatches: 3
  partially_outside_regions: 514
  altered_partially_outside_regions: 171
  images_with_partially_outside_region: 343
  completely_outside_regions: 0
  face_field_provenance_groups_total: 4700
  face_multi_region_groups: 3335
  formula_like_source_cells: 0

  # Full homography audit
  homography_transform_failures: 0
  homography_corner_residual_over_0_5px: 0

  # Full image decode audit
  image_decode_failures: 0
  images_with_decode_warnings: 0

  # Duplicate / leakage audit
  duplicate_image_sha256_groups: 0
  duplicate_decoded_pixel_sha256_groups: 0
  train_test_exact_file_overlap: 0
  train_test_decoded_pixel_overlap: 0

  # Base-card identity audit
  file_stems_with_multiple_identities: 0
  identities_with_multiple_file_stems: 0

  # Training-card structure
  train_stems_not_nine_images: 0
  train_stems_bad_composition: 0
  train_stem_variant_hardware_mismatches: 0

  # Intentional train/test card reuse
  shared_train_test_stems: 211
  shared_train_test_non_digital3_records: 0
  shared_train_test_digital3_images: 633
  shared_train_test_digital3_stems: 211
  shared_digital3_bad_hardware_stems: 0